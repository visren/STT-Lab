name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/ci.txt
            requirements/base.txt
            pyproject.toml

      - name: Install CI deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements/ci.txt
          python -m pip install -e .

      - name: Compile
        run: python -m compileall -q stt_lab apps envs tests

      - name: Doctor (core)
        run: python scripts/doctor.py

      - name: Pytest
        run: python -m pytest tests/ -q

  model-lab-image:
    name: Build model-lab image
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build model-lab
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/model-lab/Dockerfile
          push: false
          load: true
          tags: stt-model-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Doctor inside image
        run: docker run --rm stt-model-lab:ci doctor
